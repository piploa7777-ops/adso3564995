<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>26-border-radius</title>
    <link rel="stylesheet" href="../src/styles.css">
    <style>
        section {
            div:not(.versus) {
                background-color: #caa0f5aa;
                border: 2px solid #fff9;
                height: 200px;
                margin: 2rem auto;
                width: 200px;

                &.bradius1{
                    border-radius: 50%;
                }
                &.bradius2{
                    border-radius: 40px 0;
                }
                &.bradius3{
                    border-radius: 140px 0 0 140px;
                }
                &.bradius4{
                    border-radius: 140px 0 140px 140px;
                }
                &.bradius5{
                    border-radius: 50%;
                }
                div.versus{
                    div{
                        border-radius: 40px;
                        display: inline-block;
                        height: 140px;
                        width: 140px;
                        &.bradius6{
                            margin-left: 2.1rem;
                            corner-shape: squircle;
                        }                        
                    }
                }
            }  
        }
    </style>
</head>
<body class="css">
     <nav class="goback">
        <a href="index.html">
           <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
              </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>26-border-radius</h1>
            <img src="/03-Css/images/logo-css.png" alt="My profile" class="profile-pic">
            <h3>Property defines the radius of the element's corners.</h3> 
        </header>
        <section>
            <section>
            <h3 class="subtitle">border-radius: 50%</h3>
            <div class="bradius1"></div>
            <h3 class="subtitle">border-radius: 40px 0</h3>
            <div class="bradius2"></div>
            <h3 class="subtitle">border-radius: 140px 0 0 140px</h3>
            <div class="bradius3"></div>
            <h3 class="subtitle">border-radius: 140px 0 140px 140px</h3>
            <div class="bradius4"></div>
            <h3 class="subtitle">corner-shape: squircle</h3>
            <div class="versus">
                <div class="bradius6"></div>
            </div>
            <div class="bradius5"></div>
        </section>
        </section>
    </main>


</body>
</html>
