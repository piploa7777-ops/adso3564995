<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>37-animations</title>
    <link rel="stylesheet" href="../src/styles.css">
    <style>
        section{
            div.jungle{
                outline: 4px solid #fff9;
                border-radius: 12px;
                corner-shape: squircle;
                border: 2px solid red;
                background: url(images/jungle.png)
                            no-repeat center / contain;
                margin: 1rem auto;
                width: 360px;
                position: relative;
                height: 440px;
                
                img, div{
                    position: absolute;
                    top: 0px;
                    left: 0;

                    &.logo{
                        top: 34px;
                        left: 24px;
                        animation: 2.8s animLogo infinite ease ;
                    }

                    &.dk{
                        top: 170px;
                        width: 140px;
                        left: 110px;
                        animation: 2.8s animDK infinite ease;
                    }

                    &.move{
                        top: 286px;
                        left: 0px;
                        animation: 2s animAttack infinite ease-out;
                        img.ryno{
                            width: 120px;
                            animation: 0.25s animRyno infinite ease-in;

                        }
                    }
            }
        }    
    }
    @keyframes animLogo{
            0%, 100%{
                transform: scale(.8);
            }
            50%{
                transform: scale(1.12);
            }
        }

        @keyframes animDK {
            0%{transform: Scale(1) rotateX(0deg); top:      170px;}
            48%{transform: Scale(.75) rotateX(0deg); top:   70px;}
            52%{transform: Scale(.75) rotateX(180deg); top: 70px;}
            56%{transform: Scale(.75) rotateX(0deg); top:   70px;}
            70%{transform: Scale(1) rotateX(0deg); top:     170px;}
            100%{transform: Scale(1) rotateX(0deg); top:    170px;}

        }

        @keyframes animRyno{
            0%, 100% {transform: translateY(0);}
            50%      {transform: translateY(-12px);}
        }

        @keyframes animAttack{
            0%{transform:   rotateY(0deg);  top: 286px; left: -110px;}
            24%{transform:  rotateY(0deg);  top: 286px; left: 120px;}
            28%{transform:  rotateY(0deg);  top: 186px; left: 120px;}
            32%{transform:  rotateY(0deg);  top: 286px; left: 120px;}
            49%{transform: rotateY(0deg);   top: 286px; left: 380px;}
            50%{transform: rotateY(180deg); top: 286px; left: 380px;}
            100%{transform: rotateY(180deg);top: 286px; left: -10px;}
        }
    </style>
</head>
<body class="css">
     <nav class="goback">
        <a href="index.html">
           <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
              </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>37-animations</h1>
            <img src="/03-Css/images/logo-css.png" alt="My profile" class="profile-pic">
            <h3> @media rule mechanism used in Responsive Web Design to apply styling conditionally based on device characteristics like screen resolution or viewport width.</h3> 
        </header>
        <section>
            <h3 class="subtitle">Example:</h3>
            <div class="jungle">
                <img src="images/logo-dk.png" class="logo">
                <img src="images/dk.png" class="dk">
                <div class="move">
                    <img src="images/ryno.png" class="ryno">
                </div>
            </div>
        </section>
    </main>


</body>
</html>
