<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>31-filters</title>
    <link rel="stylesheet" href="../src/styles.css">
    <style>
        img.filter{
            background: linear-gradient(35deg, crimson 50%, purple 50%);
            border-radius: 14px;
            corner-shape: squircle;
            width: 140px;
            display: block;
            margin: 2rem auto;
            transition: all 1seg ease;

            &.filter1{
                filter: grayscale(1);
            }
            &.filter2{
                filter: blur(8px);
            }
            &.filter3{
                filter: sepia(1);
            }
            &.filter4{
                filter: brightness(.5);
            }
            &.filter5{
                filter: invert();
            }
            &.filter6{
                filter: drop-shadow(0 0 12px #fff);
            }
            &.filter7{
                filter: hue-rotate(320deg);
            }
            &:hover{
                filter: none;
            }
        }
    </style>
</head>
<body class="css">
     <nav class="goback">
        <a href="index.html">
           <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#ffff" viewBox="0 0 256 256">
              <path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z">
              </path>
            </svg>
        </a>
    </nav>
    <main>
        <header class="mmenu internal">
            <h1>31-filters</h1>
            <img src="/03-Css/images/logo-css.png" alt="My profile" class="profile-pic">
            <h3>Property (filter) applying graphical transformations (e.g., blur(), grayscale(), contrast(), drop-shadow()) to elements before display.</h3> 
        </header>
        <section>
           
            <h3 class="subtitle">GrayScale</h3>
            <img class="filter filter1" src="images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Blur</h3>
            <img class="filter filter2" src="images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Sepia</h3>
            <img class="filter filter3" src="images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Brightness</h3>
            <img class="filter filter4" src="images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Invert</h3>
            <img class="filter filter5" src="images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">Drop Shadow</h3>
            <img class="filter filter6" src="images/inosuke.png" alt="Inosuke">
            <h3 class="subtitle">HUE Rotate</h3>
            <img class="filter filter7" src="images/inosuke.png" alt="Inosuke">
        </section>
    </main>


</body>
</html>
